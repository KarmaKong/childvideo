# 小小影院 · 自建部署（Jellyfin 当媒体大脑 + nginx 同源反代 + 儿童前端静态包）
#
# 首次使用：
#   1. cd deploy && cp .env.example .env   # 按需修改 PUID/PGID/TZ
#   2. 准备内容目录：mkdir -p media   （ingest CLI 会往这里写，见 ../tools/ingest）
#   3. docker compose up -d
#   4. 通过 SSH 隧道访问 Jellyfin 管理台做首次设置（端口只绑在 127.0.0.1）：
#        ssh -L 8096:localhost:8096 user@服务器
#        浏览器打开 http://localhost:8096 —— 建媒体库、建「儿童」用户、生成 API Key
#   5. 到项目根目录 cp .env.example .env，填 VITE_SOURCE=jellyfin 及 JELLYFIN_* 变量
#   6. npm run build   （产物 dist/ 被 nginx 挂载）
#   7. docker compose restart web
#
# 生产环境请在本 compose 前面再加一层 HTTPS（Caddy / 云上 SLB / Nginx+证书）。

services:
  jellyfin:
    image: jellyfin/jellyfin:10.9.11
    container_name: cv-jellyfin
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      - ./media:/media:ro
    # 端口只对本机开放：前端走 nginx 的 /jf 反代，管理台走 SSH 隧道
    ports:
      - "127.0.0.1:8096:8096"
    networks:
      - cv

  web:
    image: nginx:1.27-alpine
    container_name: cv-web
    restart: unless-stopped
    depends_on:
      - jellyfin
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../dist:/usr/share/nginx/html:ro
    networks:
      - cv

networks:
  cv:
    driver: bridge
