# 小小影院 · 自建部署（Jellyfin 当媒体大脑 + nginx 同源反代 + 儿童前端静态包）
#
# 家庭 NAS（最常见）：
#   1. 在笔记本上 npm run build，把整个项目目录拷到 NAS 共享文件夹（含 dist/）
#   2. cd deploy && cp .env.example .env
#      - NAS 的 80/443 常被管理界面占用 → WEB_PORT 默认 8080
#      - 家里内网可信 → JELLYFIN_BIND 设成 0.0.0.0:8096，方便任意设备开管理台
#   3. mkdir -p media   （ingest CLI 往这里写）
#   4. Container Manager / Container Station 里用本 compose 建 Project，或 docker compose up -d
#   5. 浏览器开 http://NAS内网IP:8096 做 Jellyfin 首次设置（建库 / 建 kid 用户 / 生成 API Key）
#   6. 回项目根目录 cp .env.example .env，填 VITE_SOURCE=jellyfin 及 JELLYFIN_* 变量
#   7. 再 npm run build，回拷 dist/，docker compose restart web
#   8. 儿童端访问 http://NAS内网IP:8080/
#
# 云服务器（公网）：JELLYFIN_BIND 保持 127.0.0.1:8096，管理台走 SSH 隧道；
#   前面再加一层 HTTPS（Caddy / 云 SLB / Nginx+证书）。

services:
  jellyfin:
    image: jellyfin/jellyfin:10.9.11
    container_name: cv-jellyfin
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      - ./media:/media:ro
    # 家庭 NAS：设 JELLYFIN_BIND=0.0.0.0:8096（内网直连管理台）
    # 公网服务器：保持默认 127.0.0.1:8096（仅本机，管理台走 SSH 隧道）
    ports:
      - "${JELLYFIN_BIND:-127.0.0.1:8096}:8096"
    networks:
      - cv

  web:
    image: nginx:1.27-alpine
    container_name: cv-web
    restart: unless-stopped
    depends_on:
      - jellyfin
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../dist:/usr/share/nginx/html:ro
    networks:
      - cv

networks:
  cv:
    driver: bridge
