# 小小影院 · 自建部署
#
# 两种用法：
#
# A) 已经有 Jellyfin（TerraMaster/群晖 应用中心装的，或你自己的容器）—— 只跑前端 nginx：
#      cd deploy && cp .env.example .env
#      在 .env 里把 JF_UPSTREAM 指向现有 Jellyfin，例如
#        JF_UPSTREAM=http://192.168.1.50:8096
#      docker compose up -d            # 只起 cv-web
#
# B) 全新装，连 Jellyfin 一起起：
#      cd deploy && cp .env.example .env      # JF_UPSTREAM 保持默认 http://jellyfin:8096
#      mkdir -p media jellyfin/config jellyfin/cache
#      docker compose --profile bundled up -d
#
# 之后：开 http://NAS内网IP:8096 做 Jellyfin 设置（建库 / 建 kid 用户 / API Key），
# 回项目根目录填 .env（VITE_SOURCE=jellyfin ...）→ npm run build → 回拷 dist/ →
# docker compose up -d --force-recreate web
#
# 儿童端： http://NAS内网IP:8080/

services:
  # 仅用法 B 需要：docker compose --profile bundled up -d
  jellyfin:
    profiles: ["bundled"]
    image: jellyfin/jellyfin:10.9.11
    container_name: cv-jellyfin
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      - ./media:/media:ro
    ports:
      - "${JELLYFIN_BIND:-0.0.0.0:8096}:8096"
    networks:
      - cv

  web:
    image: nginx:1.27-alpine
    container_name: cv-web
    restart: unless-stopped
    environment:
      # 现有 Jellyfin：在 .env 里改成 http://<NAS内网IP>:8096
      # 全新(profile bundled)：保持 http://jellyfin:8096
      - JF_UPSTREAM=${JF_UPSTREAM:-http://jellyfin:8096}
      - NGINX_ENVSUBST_FILTER=^JF_
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ../dist:/usr/share/nginx/html:ro
    networks:
      - cv

networks:
  cv:
    driver: bridge
