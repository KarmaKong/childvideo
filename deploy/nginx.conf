# 同源反代：/ 出儿童前端静态包，/jf/ 转发到 Jellyfin（绕开 CORS）
# Jellyfin 以默认根路径运行，这里把 /jf/ 前缀剥掉再转发。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # 播放大文件时关闭响应缓冲
    proxy_buffering off;
    client_max_body_size 20m;

    # ---- 儿童前端（SPA，history 路由回退） ----
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---- Jellyfin API（前端只用到这些） ----
    # 注意结尾的斜杠：会把 /jf/ 前缀剥掉，Jellyfin 收到的是 /Users/... /Videos/...
    location /jf/ {
        proxy_pass http://jellyfin:8096/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # 管理台（/web、/dashboard）不经此处开放。
    # 首次设置和日常管理请用 SSH 隧道直连容器：
    #   ssh -L 8096:localhost:8096 user@server  然后开 http://localhost:8096
    location ~ ^/jf/(web|dashboard) {
        return 404;
    }
}
